services:
  db:
    image: postgres:16-alpine
    container_name: afreqa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-afreqa_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-afreqa_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/scripts/init-db-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-afreqa_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      file: docker/Dockerfile.web
    container_name: afreqa-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://afreqa_app:afreqa_app_dev_password@db:5432/afreqa_db}
      DATABASE_OWNER_URL: ${DATABASE_OWNER_URL:-postgresql://postgres:afreqa_dev_password@db:5432/afreqa_db}
      STORAGE_UPLOAD_DIR: /app/uploads
      STORAGE_PUBLIC_URL_PREFIX: /uploads
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-Afreqa Nairobi <hello@afreqa.com>}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@afreqa.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-AfreqaAdmin2026!}
      DEMO_MODE: ${DEMO_MODE:-false}
    volumes:
      - uploads:/app/uploads
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q 'ok' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      file: docker/Dockerfile.worker
    container_name: afreqa-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://afreqa_app:afreqa_app_dev_password@db:5432/afreqa_db}
      STORAGE_UPLOAD_DIR: /app/uploads
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-Afreqa Nairobi <hello@afreqa.com>}
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:

