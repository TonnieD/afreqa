services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: afreqa-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port

  web:
    environment:
      NODE_ENV: production
      DEMO_MODE: "true"
    volumes:
      - ./uploads:/app/uploads

  worker:
    environment:
      NODE_ENV: production
    volumes:
      - ./uploads:/app/uploads

